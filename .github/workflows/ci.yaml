# ============================================================================
# GitHub Actions CI Pipeline
# ============================================================================
# CONCEPT: CI/CD (Continuous Integration / Continuous Deployment)
#
# CI automatically runs tests whenever you push code or open a PR.
# This catches bugs BEFORE they reach production.
#
# This pipeline:
# 1. Runs on every push to main and every PR
# 2. Tests on Python 3.10 (matching SageMaker runtime)
# 3. Runs linting, type checking, and unit tests
# 4. Reports test coverage
#
# For a FAANG interview, having CI shows you understand:
# - Software engineering best practices
# - Automated quality gates
# - Production readiness

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ --max-line-length=100 --ignore=E501,W503 --count --show-source --statistics

      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # Don't fail CI on type warnings (yet)

      - name: Run unit tests
        run: |
          pytest tests/ -v -m "not integration" --tb=short --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # Validate CloudFormation template
  validate-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate SAM template
        run: |
          pip install aws-sam-cli
          sam validate --template infrastructure/cloudformation/template.yaml
        continue-on-error: true
