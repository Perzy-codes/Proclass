name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install Pillow numpy scikit-learn pyyaml tqdm pytest pytest-cov

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ tests/ --max-line-length=100 --ignore=E501,W503,E402,F401 --count --show-source --statistics
        continue-on-error: true

      - name: Run unit tests
        run: |
          PYTHONPATH=src/training:src/inference:src/preprocessing pytest tests/test_model.py -v -k "not test_class_weights and not test_handler_success and not test_handler_invalid" --tb=short

  validate-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate SAM template
        run: |
          pip install aws-sam-cli
          sam validate --template infrastructure/cloudformation/template.yaml
        continue-on-error: true
