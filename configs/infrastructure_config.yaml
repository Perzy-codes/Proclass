# ============================================================================
# Infrastructure Configuration
# ============================================================================
# AWS resource settings, separate from ML training config.
# Update these for different environments (dev/staging/prod).

environment: dev
region: us-east-1

# S3 Configuration
s3:
  raw_bucket_suffix: product-images-raw
  processed_bucket_suffix: product-images-processed
  artifacts_bucket_suffix: ml-model-artifacts
  
  lifecycle:
    transition_to_ia_days: 30       # Move to Infrequent Access after 30 days
    transition_to_glacier_days: 90  # Archive after 90 days
    processed_expiry_days: 90       # Auto-delete processed images after 90 days

# DynamoDB Configuration
dynamodb:
  table_name: product-predictions
  billing_mode: PAY_PER_REQUEST     # On-demand pricing (auto-scales)
  ttl_days: 90                      # Auto-delete predictions after 90 days
  stream_enabled: true
  point_in_time_recovery: true

# API Gateway Configuration
api_gateway:
  stage_name: dev
  throttle_rate: 100    # Requests per second
  throttle_burst: 200   # Maximum burst
  cache_enabled: false  # Enable in production to reduce Lambda calls
  cache_ttl: 300        # 5 minutes

# Lambda Configuration
lambda:
  memory_mb: 1024       # More memory = more CPU = faster image processing
  timeout_seconds: 30
  reserved_concurrency: null  # null = use default account limit

# SageMaker Endpoint
sagemaker:
  endpoint_name: product-classifier
  instance_type: ml.m5.large
  initial_instance_count: 1
  
  autoscaling:
    enabled: true
    min_capacity: 1
    max_capacity: 5
    target_invocations_per_instance: 75
    scale_in_cooldown: 300    # 5 min before removing instances
    scale_out_cooldown: 60    # 1 min before adding instances

# Monitoring
monitoring:
  dashboard_name: ProductClassifierDashboard
  
  alarms:
    high_latency:
      threshold_ms: 1000
      evaluation_periods: 3
      period_seconds: 300
    
    high_error_rate:
      threshold_count: 10
      evaluation_periods: 1
      period_seconds: 300
    
    lambda_throttles:
      threshold_count: 5
      evaluation_periods: 2
      period_seconds: 300

# Retraining Pipeline
retraining:
  schedule: 'cron(0 2 ? * SUN *)'    # Every Sunday at 2 AM UTC
  min_accuracy_threshold: 90.0        # Only deploy if accuracy >= 90%
  min_images_per_class: 100           # Skip if insufficient data
  spot_training: true
